<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/IMG/logo_da_aba_de_pesquisa.png" type="image/png">
    <title>Avaliação de Produto</title>
    <link rel="stylesheet" href="CSS/forms.css">
</head>

<body>

    <form id="formulario" method="post">

        <!-- Aqui é o menu-->

        <nav class="menu">
            <div class="menu-container">
                <div class="logo"><img src="assets/IMG/logo completa.png" alt="Logo"></div>
                <div class="menu-toggle" id="menu-toggle">☰</div>
                <ul id="menu-list">
                    <li><a href="index.html">EcoTech</a></li>
                    <li><a href="sobre.html">Sobre nós</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><a href="forms.html">Avalie seu produto</a></li>
                    <li><a href="ecoprodutos.html">EcoProdutos</a></li>
                </ul>
            </div>
        </nav>
        <!-- Botão de tema fora da lista -->
        <button id="theme-switch">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f">
                <path
                    d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f">
                <path
                    d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" />
            </svg>
        </button>


        <main>
            <h1>Avalie seu produto aqui!</h1>
            <p>Preencha o formulário para podermos avaliar seu produto</p>
            <hr><br>

            <label><strong>Nome:</strong></label>
            <input type="text" name="nome" id="nome" required><br><br>

            <label><strong>Sobrenome:</strong></label>
            <input type="text" name="sobrenome" id="sobrenome" required><br><br>

            <label><strong>E-mail:</strong></label>
            <input type="email" name="email" id="email" required><br><br>


            <label><strong>Qual o seu gênero?</strong></label>
            <div id="genero-group" style="margin-bottom: 1rem;">
                <div style="display: flex; align-items: center; margin-bottom: 5px; flex-direction: row-reverse;">
                    <input type="radio" name="genero" value="Feminino" style="margin-right: 5px;">
                    <label for="Feminino" style="margin-right: 5px;"> Feminino</label>
                </div>
                <br>

                <div id="genero-group" style="margin-bottom: 1rem;">
                    <div style="display: flex; align-items: center; margin-bottom: 5px; flex-direction: row-reverse;">
                        <input type="radio" name="genero" value="Masculino" style="margin-right: 5px;">
                        <label for="Masculino" style="margin-right: 5px;"> Masculino</label>
                    </div>
                    <br>

                    <div id="genero-group" style="margin-bottom: 1rem;">
                        <div
                            style="display: flex; align-items: center; margin-bottom: 5px; flex-direction: row-reverse;">
                            <input type="radio" name="genero" value="Outro" style="margin-right: 5px;">
                            <label for="Outro" style="margin-right: 5px;"> Outro</label>
                        </div>
                        <br>

                        <div id="genero-group" style="margin-bottom: 1rem;">
                            <div
                                style="display: flex; align-items: center; margin-bottom: 5px; flex-direction: row-reverse;">
                                <input type="radio" name="genero" value="Prefiro não informar"
                                    style="margin-right: 5px;">
                                <label for="Prefiro não informar style=" margin-right: 5px;"> Prefiro não
                                    informar</label>
                            </div>
                            <br>


                            <legend>Endereço</legend>

                            <label><strong>Tipo de Logradouro:</strong></label>
                            <select id="Logradouro" required>
                                <option value="">Selecione</option>
                                <option>Avenida</option>
                                <option>Estrada</option>
                                <option>Rua</option>
                            </select><br><br>

                            <label><strong>Endereço:</strong></label>
                            <input type="text" name="endereco" id="endereco" required><br><br>

                            <label><strong>Número:</strong></label>
                            <input type="number" name="numero" id="numero" required min="1" step="1"><br><br>

                            <label><strong>Bairro:</strong></label>
                            <input type="text" name="bairro" id="bairro" required><br><br>

                            <label><strong>Cidade:</strong></label>
                            <input type="text" name="cidade" id="cidade" required><br><br>

                            <label><strong>CEP:</strong></label>
                            <input type="text" name="CEP" id="CEP" required pattern="\d{5}-?\d{3}"
                                maxlength="9"><br><br>

                            <label><strong>Estado:</strong></label>
                            <select id="estado" required>
                                <option value="">Selecione</option>
                                <option>AC</option>
                                <option>AL</option>
                                <option>AP</option>
                                <option>AM</option>
                                <option>BA</option>
                                <option>CE</option>
                                <option>DF</option>
                                <option>ES</option>
                                <option>GO</option>
                                <option>MA</option>
                                <option>MT</option>
                                <option>MS</option>
                                <option>MG</option>
                                <option>PA</option>
                                <option>PB</option>
                                <option>PR</option>
                                <option>PE</option>
                                <option>PI</option>
                                <option>RJ</option>
                                <option>RN</option>
                                <option>RS</option>
                                <option>RO</option>
                                <option>RR</option>
                                <option>SC</option>
                                <option>SP</option>
                                <option>SE</option>
                                <option>TO</option>
                            </select>
                            <br>


                            <legend>Mensagem</legend>
                            <label><strong>Descreva detalhadamente as informações sobre o item:</strong></label><br>
                            <textarea rows="6" style="width: 26em" id="experiencia" name="experiencia"
                                required></textarea>
                            <br>

                            <h2>Envie uma Foto</h2>
                            <label for="foto">Escolha uma foto:</label>
                            <input type="file" name="foto" id="foto" accept="image/*" required><br><br>
                            
                            <button type="submit">Enviar</button>

    </form>


</body>
<!-- Scripts -->
<script src="JS/menu.js"></script>
<script src="JS/forms.js"></script>
<script src="JS/theme.js"></script>

</html>
