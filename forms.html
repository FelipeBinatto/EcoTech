<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/IMG/logo_da_aba_de_pesquisa.png" type="image/png" />
    <title>Avaliação de Produto</title>
    <link rel="stylesheet" href="CSS/forms.css" />
</head>

<body>
    <form id="formulario" method="post">
        <!-- Botões de fonte -->
        <div id="font-buttons">
            <button id="decrease-font" type="button">A-</button>
            <button id="increase-font" type="button">A+</button>
        </div>

        <!-- Navegação -->
        <nav class="menu">
            <div class="menu-container">
                <div class="logo">
                    <img src="assets/IMG/logo completa.png" alt="Logo" />
                </div>
                <div class="menu-toggle" id="menu-toggle">☰</div>
                <ul id="menu-list">
                    <li><a href="index.html">EcoTech</a></li>
                    <li><a href="sobre.html">Sobre nós</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><a href="forms.html">Avalie seu produto</a></li>
                    <li><a href="ecoprodutos.html">EcoProdutos</a></li>
                </ul>
            </div>
        </nav>

        <button id="theme-switch" class="theme-button">
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                width="24px" fill="#1f1f1f">
                <path
                    d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
            </svg>

            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                fill="#1f1f1f">
                <path
                    d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm40-83q119-15 199.5-104.5T800-480q0-123-80.5-212.5T520-797v634Z" />
            </svg>

            <svg class="icon-contrast" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                width="24px" fill="#1f1f1f">
                <path
                    d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" />
            </svg>

        </button>

        <main class="form-grid">
            <h1>Avalie seu produto aqui!</h1>
            <p>Preencha o formulário para podermos avaliar seu produto</p>
            <hr>

            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" required />
            </div>

            <div class="campo">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" name="sobrenome" id="sobrenome" required />
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required />
            </div>

            <div class="campo">
                <label for="Logradouro">Tipo de Logradouro:</label>
                <select id="Logradouro" required>
                    <option value="">Selecione</option>
                    <option>Avenida</option>
                    <option>Estrada</option>
                    <option>Rua</option>
                </select>
            </div>

            <div class="campo">
                <label for="endereco">Endereço:</label>
                <input type="text" name="endereco" id="endereco" required />
            </div>

            <div class="campo">
                <label for="numero">Número:</label>
                <input type="number" name="numero" id="numero" required min="1" />
            </div>

            <div class="campo">
                <label for="bairro">Bairro:</label>
                <input type="text" name="bairro" id="bairro" required />
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" name="cidade" id="cidade" required />
            </div>

            <div class="campo">
                <label for="estado">Estado:</label>
                <select id="estado" required>
                    <option value="">Selecione</option>
                    <option>AC</option>
                    <option>AL</option>
                    <option>AP</option>
                    <option>AM</option>
                    <option>BA</option>
                    <option>CE</option>
                    <option>DF</option>
                    <option>ES</option>
                    <option>GO</option>
                    <option>MA</option>
                    <option>MT</option>
                    <option>MS</option>
                    <option>MG</option>
                    <option>PA</option>
                    <option>PB</option>
                    <option>PR</option>
                    <option>PE</option>
                    <option>PI</option>
                    <option>RJ</option>
                    <option>RN</option>
                    <option>RS</option>
                    <option>RO</option>
                    <option>RR</option>
                    <option>SC</option>
                    <option>SP</option>
                    <option>SE</option>
                    <option>TO</option>
                </select>
            </div>

            <div class="campo">
                <label for="CEP">CEP:</label>
                <input type="text" name="CEP" id="CEP" required pattern="\d{5}-?\d{3}" maxlength="9" />
            </div>

            <div class="genero-textarea-container">
                <div class="campo textarea-container">
                    <label for="descricao">Descreva seu produto</label>
                    <textarea id="descricao" name="descricao" rows="6" required></textarea>
                    <small id="contador-caracteres">0/500 caracteres</small>
                </div>

                <div class="campo genero-container">
                    <label>Gênero:</label>
                    <div id="genero-group">
                        <div>
                            <label for="feminino"><span>Feminino</span>
                                <input type="radio" id="feminino" name="genero" value="Feminino" />
                            </label>
                        </div>
                        <div>
                            <label for="masculino"><span>Masculino</span>
                                <input type="radio" id="masculino" name="genero" value="Masculino" />
                            </label>
                        </div>
                        <div>
                            <label for="outro"><span>Outro</span>
                                <input type="radio" id="outro" name="genero" value="Outro" />
                            </label>
                        </div>
                        <div>
                            <label for="prefiro-nao-informar"><span>Prefiro não informar</span>
                                <input type="radio" id="prefiro-nao-informar" name="genero" value="Prefiro não informar"
                                    required />
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="upload-box" style="grid-column: 1 / -1;">
                <label for="foto">Foto do item:</label>
                <input type="file" name="foto" id="foto" accept="image/*" required />
            </div>

            <div class="form-buttons">

                <button id="btn-buscar" type="button">Buscar pontos de descarte próximos</button>
                <button type="submit">Enviar</button>
            </div>

            <ul id="lista-pontos" style="grid-column: 1 / -1;"></ul>
        </main>
    </form>
     <footer>EcoTech | Itu-SP Telefone: (11) 99678-3467</footer>


</body>
<script src="JS/menu.js"></script>
<script src="JS/forms.js"></script>
<script src="JS/api.js"></script>
<script src="JS/font.js"></script>

</html>
